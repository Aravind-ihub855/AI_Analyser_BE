readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "motor>=3.3.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "openpyxl>=3.1.2",
    "httpx>=0.25.0",
    "langchain>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "langchain-groq>=0.1.0",
    "langchain-experimental>=0.0.50",
    "duckduckgo-search>=5.3.0",
    "google-search-results>=2.4.0",
